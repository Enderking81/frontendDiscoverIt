<section class="auth-page">
  <div class="auth-card">
    <img src="assets/Discoverit2.png" alt="DiscoverIt" class="auth-logo" />
    <h2>Iniciar sesión</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="tu@email.com" />
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <span class="field-error">Ingresá un email válido</span>
        }
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" />
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <span class="field-error">La contraseña es obligatoria</span>
        }
      </div>

      @if (errorMsg) {
        <p class="form-error" role="alert">{{ errorMsg }}</p>
      }

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p class="alt-link">
      ¿No tenés cuenta? <a routerLink="/register">Registrate</a>
    </p>
  </div>
</section>
