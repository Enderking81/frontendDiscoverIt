<!-- backdrop oscuro — cierra el sidebar al hacer clic -->
<div
  class="backdrop"
  [class.visible]="isOpen"
  (click)="close()"
  aria-hidden="true"
></div>

<!-- panel lateral -->
<aside class="sidebar" [class.open]="isOpen" role="navigation" aria-label="Menú lateral">

  <!-- encabezado del sidebar -->
  <div class="sidebar-header">
    <img src="assets/Discoverit2.png" alt="DiscoverIt" class="sb-logo" />
    <button class="close-btn" (click)="close()" aria-label="Cerrar menú">
      <!-- ícono X -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- avatar + datos del usuario -->
  @if (user) {
    <div class="user-card">
      <div class="avatar">{{ user.nickname.charAt(0).toUpperCase() }}</div>
      <div class="user-info">
        <span class="user-name">{{ user.nickname }}</span>
        <span class="user-email">{{ user.email }}</span>
        @if (user.isAdmin) {
          <span class="admin-badge">Admin</span>
        }
      </div>
    </div>
  } @else {
    <div class="guest-card">
      <p>¿Ya tenés cuenta?</p>
      <div class="guest-actions">
        <button type="button" class="btn-outline" (click)="navigateTo('/login')">Iniciar sesión</button>
        <button type="button" class="btn-solid" (click)="navigateTo('/register')">Registrarse</button>
      </div>
    </div>
  }

  <!-- separador -->
  <div class="divider"></div>

  <!-- navegación principal -->
  <nav class="nav-list">
    @for (item of navItems; track item.route) {
      <button
        type="button"
        class="nav-item"
        [class.active]="router.url === item.route || (item.route !== '/' && router.url.startsWith(item.route))"
        (click)="navigateTo(item.route)"
      >
        <!-- íconos SVG en el template (innerHTML los borraba por sanitización) -->
        <span class="nav-icon" aria-hidden="true">
          @switch (item.icon) {
            @case ('home') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            }
            @case ('user') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            }
            @case ('heart') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            }
            @case ('shield') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            }
          }
        </span>
        <span class="nav-label">{{ item.label }}</span>
      </button>
    }
  </nav>

  <!-- footer del sidebar -->
  <div class="sidebar-footer">
    @if (user) {
      <button class="logout-btn" (click)="logout()">
        <!-- ícono log-out -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Cerrar sesión
      </button>
    }
    <p class="footer-copy">DiscoverIt &copy; 2026</p>
  </div>

</aside>
