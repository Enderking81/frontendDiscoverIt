<article class="card" [routerLink]="['/places', place.id]">

  <!-- imagen con overlay de categoría -->
  <div class="card-img-wrap">
    <img [src]="place.image" [alt]="place.name" (error)="onImgError($event)" loading="lazy" />

    <!-- pill de categoría sobre la imagen -->
    @if (place.Category) {
      <span class="category-pill">{{ place.Category.name }}</span>
    }

    <!-- botón de like -->
    <button class="like-btn" [class.liked]="liked" (click)="onToggleLike($event)" aria-label="Me gusta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
    </button>
  </div>

  <!-- info del lugar -->
  <div class="card-body">
    <h3 class="card-title">{{ place.name }}</h3>

    <div class="card-location">
      <!-- ícono pin SVG inline -->
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
      </svg>
      <span>{{ place.location }}</span>
    </div>

    <p class="card-desc">{{ place.description }}</p>

    <!-- rating con estrellas -->
    <div class="card-footer">
      <div class="stars">
        @for (full of estrellas; track $index) {
          <svg class="star" [class.full]="full" viewBox="0 0 24 24">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
        }
      </div>
      <span class="rating-num">{{ place.average_rating?.toFixed(1) ?? '—' }}</span>
    </div>
  </div>

</article>
