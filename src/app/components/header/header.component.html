<header class="navbar">
  <div class="navbar-inner">

    <!-- botón hamburguesa que abre el sidebar -->
    <button class="menu-toggle" (click)="abrirSidebar()" aria-label="Abrir menú">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6"  x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <!-- logo (la imagen ya incluye el nombre) -->
    <a routerLink="/" class="navbar-logo-wrap" aria-label="DiscoverIt, ir al inicio">
      <img src="assets/Discoverit2.png" alt="DiscoverIt" class="navbar-logo" />
    </a>

    <div class="navbar-spacer"></div>

    <!-- toggle dark mode (sol / luna) -->
    <button class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="theme.isDark ? 'Activar modo claro' : 'Activar modo oscuro'">
      @if (theme.isDark) {
        <!-- sol -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      } @else {
        <!-- luna -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      }
    </button>

    <!-- menú de usuario -->
    <app-dropdown-menu />

  </div>
</header>
