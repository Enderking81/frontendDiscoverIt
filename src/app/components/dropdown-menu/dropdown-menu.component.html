<div class="relative">
  <button (click)="toggleDropdown()" class="menu-button">
    <img src="/assets/menu.svg" alt="Menú" />
  </button>

  @if (isOpen()) {
    <ul class="dropdown-menu show">

      @if (usuario) {
        <!-- usuario logueado -->
        <li class="dropdown-item usuario-info">Hola, {{ usuario.nickname }}</li>
        <li class="dropdown-item"><a routerLink="/">Inicio</a></li>
        <li class="dropdown-item"><a routerLink="/profile">Mi cuenta</a></li>
        <li class="dropdown-item" (click)="cerrarSesion()">Cerrar sesión</li>
      } @else {
        <!-- usuario no logueado -->
        <li class="dropdown-item"><a routerLink="/login">Iniciar sesión</a></li>
        <li class="dropdown-item"><a routerLink="/register">Registrarse</a></li>
      }

    </ul>
  }
</div>
