@if (user) {
  <div class="account">
    <button type="button" class="avatar-btn" (click)="toggle()" [attr.aria-expanded]="isOpen()"
      aria-haspopup="menu" [attr.aria-label]="'Cuenta de ' + user.nickname">
      {{ initial }}
    </button>

    @if (isOpen()) {
      <div class="menu" role="menu">
        <div class="menu-header">
          <span class="menu-name">{{ user.nickname }}</span>
          <span class="menu-email">{{ user.email }}</span>
        </div>
        <a role="menuitem" class="menu-item" routerLink="/profile" (click)="close()">Mi perfil</a>
        <a role="menuitem" class="menu-item" routerLink="/favorites" (click)="close()">Mis favoritos</a>
        @if (user.isAdmin) {
          <a role="menuitem" class="menu-item accent" routerLink="/admin" (click)="close()">Panel de administración</a>
        }
        <button type="button" role="menuitem" class="menu-item danger" (click)="logout()">Cerrar sesión</button>
      </div>
    }
  </div>
} @else {
  <a routerLink="/login" class="login-btn">Ingresar</a>
}
